<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — «В Созвездиях»</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="branding container">
            <img src="./src/logo.png" alt="Логотип студии">
            <h1>Присоединяйтесь к студии «В Созвездиях»</h1>
        </div>
        <nav class="site-nav">
            <div class="container">
                <ul>
                    <li><a href="./index.html">Главная</a></li>
                    <li><a href="./katalog.html">Каталог</a></li>
                    <li><a href="./kontakts.html">Контакты</a></li>
                    <li><a href="./about.html">О нас</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="content-card">
            <h1>Регистрация</h1>
            <p class="text-lead">
                Оставьте контакты, и мы свяжемся с вами, чтобы обсудить программу занятий и ответить на вопросы.
            </p>
            <form class="contact-form">
                <input type="text" placeholder="Ваше имя" required>
                <input type="tel" placeholder="Номер телефона" required>
                <input type="email" placeholder="Email" required>
                <label class="consent">
                    <input type="checkbox" required>
                    <span>Согласен с <a href="./privacy.html" target="_blank">условиями обработки персональных данных</a></span>
                </label>
                <button class="btn" type="submit">Отправить заявку</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; Все права защищены</p>
    </footer>
</body>
</html>
